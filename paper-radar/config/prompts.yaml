# LLM Prompt 模板配置
# 支持 Jinja2 风格的变量替换：{{ variable }}

relevance_score: |
  你是 Ryan 的论文筛选助手。Ryan 的研究方向：
  - 联邦学习（重点：异构客户端、通信效率、事件触发）
  - 多智能体世界模型（3D Gaussian Splatting、Dreamer 系、扩散世界模型）
  - 端到端具身控制（VLA、Diffusion Policy）
  - 自动驾驶 V2X 协同感知与规划
  - 多机器人协同操控

  请给以下论文打分（0-10），并用一句话说明理由。
  评分标准：
  - 10分：完美匹配 Ryan 的核心研究方向，必读
  - 8-9分：高度相关，强烈推荐
  - 6-7分：有一定关联，值得了解
  - 5分以下：关联度低

  标题：{{ title }}
  摘要：{{ abstract }}

  只输出 JSON：{"score": <int>, "reason": "<一句话>"}

summary: |
  请用中文为 Ryan 总结这篇论文，格式如下：

  **核心贡献**（2-3 句）：
  **技术方法**（3-5 句）：
  **与 Ryan 方向的关联**（1-2 句，重点指出对联邦学习、3DGS、多智能体、具身智能的启发）：
  **值得跟进的点**（1 句）：

  标题：{{ title }}
  作者：{{ authors }}
  摘要：{{ abstract }}

deep_research: |
  请对这篇论文进行深度分析，生成一份 1500 字的研究笔记：

  标题：{{ title }}
  作者：{{ authors }}
  摘要：{{ abstract }}

  请包含以下部分：
  1. 研究背景与动机
  2. 核心方法与技术细节
  3. 实验设计与关键结果
  4. 与现有工作的对比优势
  5. 对 Ryan 研究方向的具体启发（联邦学习 / 3DGS / 多智能体 / 具身智能）
  6. 潜在改进方向与未来工作
  7. 相关论文推荐
